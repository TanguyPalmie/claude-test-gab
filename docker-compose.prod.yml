version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-topten}
      POSTGRES_USER: ${POSTGRES_USER:-topten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      topten_net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topten}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/questions:/app/questions:ro
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      topten_net:
        ipv4_address: 172.30.0.20

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      topten_net:
        ipv4_address: 172.30.0.30

volumes:
  pg_data:
    driver: local
  uploads_data:
    driver: local

networks:
  topten_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
