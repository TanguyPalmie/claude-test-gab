version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-topten}
      POSTGRES_USER: ${POSTGRES_USER:-topten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topten_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      topten_net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topten}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/questions:/app/questions
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      topten_net:
        ipv4_address: 172.30.0.20

  # ── Frontend ────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_WS_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
    depends_on:
      - api
    networks:
      topten_net:
        ipv4_address: 172.30.0.30

volumes:
  pg_data:
    driver: local
  uploads_data:
    driver: local

networks:
  topten_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
